<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="#060b16"/>

  <!-- Top Navbar Preview -->
  <rect x="0" y="0" width="960" height="50" fill="#090e1c" stroke="#1e293b"/>
  <rect x="24" y="10" width="30" height="30" rx="6" fill="url(#headerGrad)"/>
  <text x="31" y="30" fill="#020617" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">MAS</text>
  <text x="66" y="30" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">MassSpaceForge Pro v1.0.0</text>
  <rect x="300" y="14" width="190" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="310" y="29" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">ECSS-E-ST-10-02C &amp; ISO 22010</text>

  <!-- 5 KPI Cards -->
  <g transform="translate(24, 65)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="12" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">MAX WET MASS MPM</text>
    <text x="12" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">238.47 kg</text>
    <text x="12" y="65" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">Dry Design: 212.5 kg</text>

    <!-- KPI 2 -->
    <rect x="185" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="197" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">LV LIFT MARGIN</text>
    <text x="197" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">+47.01%</text>
    <text x="197" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">+211.5 kg Reserve PASS</text>

    <!-- KPI 3 -->
    <rect x="370" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="382" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">LATERAL CoM OFFSET</text>
    <text x="382" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">0.11 mm</text>
    <text x="382" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">Limit: ≤ 10.0 mm PASS</text>

    <!-- KPI 4 -->
    <rect x="555" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="567" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">PRINCIPAL AXIS TILT</text>
    <text x="567" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">0.261°</text>
    <text x="567" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">Limit: ≤ 0.500° PASS</text>

    <!-- KPI 5 -->
    <rect x="740" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="752" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">AUDIT SCORE</text>
    <text x="752" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">10 / 10 PASS</text>
    <text x="752" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">ECSS-E-10-02C CERTIFIED</text>
  </g>

  <!-- Main Grid Area -->
  <g transform="translate(24, 155)">
    <!-- Left Controls Panel -->
    <rect x="0" y="0" width="280" height="340" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">1. VEHICLE ENVELOPE &amp; MARGINS</text>
    <line x1="16" y1="36" x2="264" y2="36" stroke="#1e293b"/>

    <text x="16" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Launch Vehicle Capability: 450 kg</text>
    <text x="16" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">System Growth Margin: 10.0% (CDR)</text>
    <text x="16" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Usable Propellant: 25.0 kg</text>
    <text x="16" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Residual Propellant: 0.60 kg (2.4%)</text>
    <text x="16" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Clampband Lateral Limit: 10.0 mm</text>
    <text x="16" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Structure DML 4 (+5%): 54.6 kg</text>
    <text x="16" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Thermal DML 3 (+10%): 16.0 kg</text>
    <text x="16" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">EPS Solar DML 4 (+5%): 29.4 kg</text>
    <text x="16" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Payload DML 2 (+15%): 36.8 kg</text>
    <text x="16" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Harness Ratio: 4.40% (Nominal)</text>
    <rect x="16" y="300" width="248" height="26" rx="5" fill="#0ea5e9"/>
    <text x="85" y="317" fill="#020617" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">EXPORT ECSS XML</text>

    <!-- Right Chart Area -->
    <rect x="295" y="0" width="615" height="340" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="312" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">2. LATERAL CoM ENVELOPE (X-Y) &amp; SUBSYSTEM BARS</text>
    <line x1="312" y1="36" x2="895" y2="36" stroke="#1e293b"/>

    <!-- Plot Area -->
    <rect x="315" y="50" width="370" height="210" fill="#070c18" stroke="#1e293b"/>
    <!-- Clampband Circle -->
    <circle cx="500" cy="155" r="75" fill="none" stroke="#fb7185" stroke-dasharray="4 3" stroke-width="1.5"/>
    <line x1="410" y1="155" x2="590" y2="155" stroke="#334155" stroke-width="1"/>
    <line x1="500" y1="65" x2="500" y2="245" stroke="#334155" stroke-width="1"/>
    <circle cx="499" cy="154" r="5" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>
    <text x="508" y="90" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="9">r_limit = 10.0 mm</text>
    <text x="506" y="150" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">CoM (0.11 mm)</text>

    <!-- Right subsystem bars -->
    <g transform="translate(705, 50)">
      <text x="0" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">SUBSYSTEM MASS</text>

      <text x="0" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Structure (54.6 kg)</text>
      <rect x="0" y="45" width="160" height="8" rx="2" fill="#38bdf8"/>

      <text x="0" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Payload (36.8 kg)</text>
      <rect x="0" y="75" width="110" height="8" rx="2" fill="#38bdf8"/>

      <text x="0" y="100" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Power EPS (29.4 kg)</text>
      <rect x="0" y="105" width="90" height="8" rx="2" fill="#38bdf8"/>

      <text x="0" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Propulsion Dry (17.6 kg)</text>
      <rect x="0" y="135" width="55" height="8" rx="2" fill="#38bdf8"/>

      <text x="0" y="160" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Fluids (26.0 kg)</text>
      <rect x="0" y="165" width="80" height="8" rx="2" fill="#34d399"/>

      <rect x="0" y="185" width="180" height="25" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.3)"/>
      <text x="8" y="201" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">WET MPM: 238.47 kg</text>
    </g>

    <!-- Subcards row -->
    <g transform="translate(315, 270)">
      <rect x="0" y="0" width="180" height="58" rx="6" fill="#090e1c" stroke="#1e293b"/>
      <text x="8" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">NOM DRY: 193.1 kg</text>
      <text x="8" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">DML MARGIN: +8.54%</text>
      <text x="8" y="50" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">LV MARGIN: +47.0%</text>

      <rect x="195" y="0" width="180" height="58" rx="6" fill="#090e1c" stroke="#1e293b"/>
      <text x="203" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">LAT CoM: 0.11 mm</text>
      <text x="203" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">LONG Z: 369.4 mm</text>
      <text x="203" y="50" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">TIP-OFF: 0.004°/s</text>

      <rect x="390" y="0" width="180" height="58" rx="6" fill="#090e1c" stroke="#1e293b"/>
      <text x="398" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">TILT: 0.261° (≤0.5°)</text>
      <text x="398" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">SPIN RATIO: 1.031</text>
      <text x="398" y="50" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">SCORE: 10/10 PASS</text>
    </g>
  </g>
</svg>
